name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Must succeed before anything is published. This job used to carry
  # continue-on-error, and `build` did not depend on it, so a failed
  # migration still shipped a frontend that called RPCs the database did
  # not have — the schema drift the app's own 404 message describes.
  db-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      # SUPABASE_ACCESS_TOKEN authenticates the CLI against the Supabase
      # API — it is what `link` needs. It is NOT a database credential, so
      # `db push`, which opens a real Postgres connection, additionally
      # needs SUPABASE_DB_PASSWORD. Without it the CLI falls back to a
      # temporary login role and the connection is rejected outright
      # (FATAL: password authentication failed for user
      # "cli_login_postgres"), which is what this step failed on.
      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Fail with a sentence someone can act on, rather than with a
          # raw Postgres auth error thirty lines further down.
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Repository secret SUPABASE_DB_PASSWORD is not set. Add it under Settings > Secrets and variables > Actions; the value is the project's database password (Supabase Dashboard > Project Settings > Database)."
            exit 1
          fi
          supabase link --project-ref uzmhsesmszngkanjsjgy
          supabase db push

  build:
    needs: [db-push]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
